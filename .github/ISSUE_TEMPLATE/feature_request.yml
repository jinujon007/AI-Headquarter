name: Feature Request
description: Propose a new agent, tool, adapter, or UI improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check the [v2 roadmap items in CLAUDE.md](../CLAUDE.md) — some features are intentionally deferred.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New agent type
        - New tool (for existing agents)
        - New LLM adapter
        - Dashboard UI
        - 3D office / visualization
        - Performance
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not the solution.
      placeholder: "As a CEO, I want to... so that..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Be specific.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this
