name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Packages ──────────────────────────────────────────────────────────
      - name: Build packages/types
        run: npm run build --workspace=packages/types

      - name: Build packages/core
        run: npm run build --workspace=packages/core

      - name: Build packages/adapters
        run: npm run build --workspace=packages/adapters

      # ── Server ────────────────────────────────────────────────────────────
      - name: Typecheck server
        run: npx tsc --noEmit --project apps/server/tsconfig.json

      - name: Build server
        run: npm run build --workspace=apps/server

      # ── Dashboard ─────────────────────────────────────────────────────────
      - name: Typecheck dashboard
        run: npx tsc --noEmit --project apps/dashboard/tsconfig.json

      # Non-blocking: the codebase has pre-existing react-hooks violations.
      # Flip to blocking once `npm run lint --workspace=apps/dashboard` is green.
      - name: Lint dashboard (non-blocking)
        run: npm run lint --workspace=apps/dashboard
        continue-on-error: true

      - name: Build dashboard
        run: npm run build --workspace=apps/dashboard
        env:
          ADMIN_PASSWORD: ci-placeholder
          AUTH_SECRET: ci-placeholder-32-char-secret-xxxx

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Run tests
        run: npm test --workspaces --if-present
        env:
          CI: true

      # ── Security audit ────────────────────────────────────────────────────
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true  # warn but don't fail — Dependabot handles fixes
